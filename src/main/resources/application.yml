server:
  port: 9999
  forward-headers-strategy: framework
spring:
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:15432/itwebs}
    username: ${POSTGRES_USER:itwebs}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
app:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:itwebs-media}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
  amocrm:
    account-url: ${AMOCRM_ACCOUNT_URL:https://itwebs.amocrm.ru}
    redirect-uri: ${AMOCRM_REDIRECT_URI:https://itwebs.ru/api/integrations/amocrm/callback}
    pipeline-name: ${AMOCRM_PIPELINE_NAME:Заявки с сайта}
    status-name: ${AMOCRM_STATUS_NAME:Новая заявка}
    responsible-user-id: ${AMOCRM_RESPONSIBLE_USER_ID:}
    token-encryption-key: ${AMOCRM_TOKEN_ENCRYPTION_KEY:}
    retry-delay-ms: ${AMOCRM_RETRY_DELAY_MS:60000}
