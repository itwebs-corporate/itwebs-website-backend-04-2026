services:
  app:
    container_name: itwebs-backend
    image: itwebs-backend
    build: .
    restart: on-failure
    environment:
      JDBC_URL: jdbc:postgresql://postgres:15432/${POSTGRES_DB:-itwebs}
      POSTGRES_USER: ${POSTGRES_USER:-itwebs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: itwebs-media
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-itwebs}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports: ["0.0.0.0:9999:9999"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
  postgres:
    container_name: itwebs-postgres
    image: itwebs-postgres
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    command: ["postgres", "-p", "15432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itwebs}
      POSTGRES_USER: ${POSTGRES_USER:-itwebs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:15432:15432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 15432 -U ${POSTGRES_USER:-itwebs} -d ${POSTGRES_DB:-itwebs}"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    container_name: itwebs-minio
    image: itwebs-minio
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-itwebs}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes: [minio_data:/data]
volumes:
  postgres_data:
  minio_data:
